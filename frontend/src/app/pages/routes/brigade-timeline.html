<ul class="legend">
  @for (m of mains(); track m.direction) {
    <li>
      <span class="swatch" [style.background]="colors[m.direction % 2]"></span>towards
      {{ m.headsign }}
    </li>
  }
  <li><span class="swatch depot"></span>depot run</li>
  <li><span class="swatch hatched"></span>other variant</li>
  <li><span class="swatch dashed"></span>break of 30 min or more</li>
  <li class="muted">Times at the row ends: leaves and returns to the depot.</li>
</ul>

<div class="plot">
  <svg
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    [attr.width]="width()"
    [attr.height]="height()"
    role="img"
    [attr.aria-label]="
      'Timeline of ' + brigades().length + ' brigades; the table below lists them.'
    "
    (pointerleave)="hover.set(null)"
  >
    <defs>
      <pattern
        [attr.id]="hatchId"
        width="5"
        height="5"
        patternUnits="userSpaceOnUse"
        patternTransform="rotate(45)"
      >
        <rect width="2" height="5" class="hatch-line" />
      </pattern>
    </defs>
    @for (t of ticks(); track t.x) {
      <line class="grid" [attr.x1]="t.x" [attr.x2]="t.x" [attr.y1]="top - 4" [attr.y2]="height()" />
      <text class="axis-label" [attr.x]="t.x" [attr.y]="top - 8" text-anchor="middle">
        {{ t.text }}
      </text>
    }
    @for (row of rows(); track row.b.name) {
      <text
        class="name"
        [attr.x]="0"
        [attr.y]="row.mid"
        dominant-baseline="middle"
        (pointerenter)="showBrigade(row.b, label, row.mid)"
      >
        {{ row.b.name }}
      </text>
      @for (k of row.breaks; track k.x1) {
        <line
          class="break"
          [attr.x1]="k.x1"
          [attr.x2]="k.x2"
          [attr.y1]="row.mid"
          [attr.y2]="row.mid"
        />
        @if (k.x2 - k.x1 > 38) {
          <text
            class="break-label"
            [attr.x]="(k.x1 + k.x2) / 2"
            [attr.y]="row.mid - 4"
            text-anchor="middle"
          >
            {{ k.text }}
          </text>
        }
        <rect
          class="hit"
          [attr.x]="k.x1"
          [attr.y]="row.mid - 8"
          [attr.width]="k.x2 - k.x1"
          height="16"
          (pointerenter)="showBreak(row.b, k.k, (k.x1 + k.x2) / 2, row.mid)"
        />
      }
      @for (run of row.runs; track run.r.from) {
        <rect
          class="run"
          [attr.x]="run.x"
          [attr.y]="row.barY"
          [attr.width]="run.w"
          height="12"
          rx="2"
          [style.fill]="run.color"
          (pointerenter)="showRun(row.b, run.r, run.x + run.w / 2, row.mid)"
        />
        @if (run.r.kind !== 'main') {
          <rect
            class="hatch"
            [attr.x]="run.x"
            [attr.y]="row.barY"
            [attr.width]="run.w"
            height="12"
            rx="2"
            [attr.fill]="'url(#' + hatchId + ')'"
          />
        }
      }
      <text
        class="time"
        [attr.x]="row.startX - 4"
        [attr.y]="row.mid"
        text-anchor="end"
        dominant-baseline="middle"
      >
        {{ clock(row.b.start) }}
      </text>
      <text class="time" [attr.x]="row.endX + 4" [attr.y]="row.mid" dominant-baseline="middle">
        {{ clock(row.b.end) }}
      </text>
    }
  </svg>

  @if (hover(); as h) {
    <div
      class="chart-tooltip above"
      [class.left]="h.left"
      [style.left.px]="h.x"
      [style.top.px]="h.y"
      aria-hidden="true"
    >
      <strong>{{ h.title }}</strong>
      <span class="muted">{{ h.detail }}</span>
    </div>
  }
</div>
