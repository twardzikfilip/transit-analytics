<div class="header">
  <h1>Live map · Białystok</h1>
  <span class="muted">
    {{ count() }} vehicles
    @if (lastUpdated(); as t) {
      · updated {{ t | date: 'mediumTime' }}
    }
    @if (error(); as message) {
      · <span class="error">{{ message }}</span>
    }
  </span>
</div>
<div #map class="map"></div>
<p class="muted source">Live data: <a href="https://zbiorkom.live" target="_blank" rel="noopener">zbiorkom.live</a></p>
