<aside class="sidebar">
  <div class="brand">Transit Analytics</div>
  <nav aria-label="Pages">
    @for (group of navGroups; track group.label) {
      <h2 class="group">{{ group.label }}</h2>
      <ul>
        @for (item of group.items; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
              <app-icon class="icon" [name]="item.icon" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <h1 class="page-title">{{ pageTitle() }}</h1>
    <span class="user"
      >{{ username() }} <span class="role">{{ role() }}</span></span
    >
    <div class="menu">
      <button
        type="button"
        class="hamburger"
        aria-label="Open menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu($event)"
      >
        <span></span><span></span><span></span>
      </button>
      @if (menuOpen()) {
        <ul class="dropdown" role="menu">
          <li role="none">
            <a role="menuitem" routerLink="/settings" (click)="menuOpen.set(false)">Settings</a>
          </li>
          <li role="none">
            <button role="menuitem" type="button" (click)="logout()">Logout</button>
          </li>
        </ul>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
