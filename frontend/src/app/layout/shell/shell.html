<aside class="sidebar">
  <div class="brand">Transit Analytics</div>
  <nav>
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">
        <span class="icon" aria-hidden="true">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <span class="user">{{ username() }} <span class="role">{{ role() }}</span></span>
    <div class="menu">
      <button
        type="button"
        class="hamburger"
        aria-label="Open menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu($event)"
      >
        <span></span><span></span><span></span>
      </button>
      @if (menuOpen()) {
        <ul class="dropdown" role="menu">
          <li role="none">
            <a role="menuitem" routerLink="/settings" (click)="menuOpen.set(false)">Settings</a>
          </li>
          <li role="none">
            <button role="menuitem" type="button" (click)="logout()">Logout</button>
          </li>
        </ul>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
