<app-sidebar [open]="navOpen()" (close)="navOpen.set(false)" />

<!-- On a phone, the open sidebar covers the page; a tap beside it hides it. -->
@if (navOpen()) {
  <div class="backdrop" aria-hidden="true" (click)="navOpen.set(false)"></div>
}

<div class="main">
  <header class="topbar">
    @if (back(); as b) {
      <button
        type="button"
        class="back"
        [attr.aria-label]="t(b.label)"
        [title]="t(b.label)"
        (click)="b.go()"
      >
        <app-icon name="chevronLeft" />
      </button>
    }
    <button
      type="button"
      class="nav-toggle"
      aria-controls="sidebar"
      [attr.aria-expanded]="navOpen()"
      [attr.aria-label]="t(navOpen() ? 'nav.hidePages' : 'nav.showPages')"
      (click)="toggleNav($event)"
    >
      <app-icon name="sidebar" />
    </button>
    <h1 class="page-title">{{ pageTitle() }}</h1>
    <span class="user"
      >{{ username() }} <span class="role">{{ role() }}</span></span
    >
    <div class="menu">
      <button
        type="button"
        class="hamburger"
        [attr.aria-label]="t('nav.openMenu')"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu($event)"
      >
        <span></span><span></span><span></span>
      </button>
      @if (menuOpen()) {
        <ul class="dropdown" role="menu">
          <li role="none">
            <a role="menuitem" routerLink="/settings" (click)="menuOpen.set(false)"
              ><app-icon name="settings" />{{ t('nav.settings') }}</a
            >
          </li>
          <li role="none" *appHasRole="'ADMIN'">
            <a role="menuitem" routerLink="/users" (click)="menuOpen.set(false)"
              ><app-icon name="users" />{{ t('nav.users') }}</a
            >
          </li>
          <li role="none">
            <a role="menuitem" routerLink="/sources" (click)="menuOpen.set(false)"
              ><app-icon name="sources" />{{ t('nav.sources') }}</a
            >
          </li>
          <li role="none">
            <button role="menuitem" type="button" (click)="logout()">
              <app-icon name="logout" />{{ t('nav.logout') }}
            </button>
          </li>
        </ul>
      }
    </div>
  </header>

  <!-- Waiting for the backend: a thin bar under the header (shown only if the wait lasts, so quick answers don't
       flicker). -->
  @if (busy()) {
    <app-activity-bar />
  }

  <main class="content">
    <router-outlet />
  </main>
</div>
