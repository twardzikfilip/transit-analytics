# A tag app-v1.2.0 or recorder-v1.0.1 on main builds that release's images (for ARM and x86 servers) and puts them in
# GitHub's registry: transit-backend and transit-frontend, or transit-recorder. See README, "Versions".
name: Release

on:
  push:
    tags: ["app-v*", "recorder-v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is the version, and on main
        run: |
          tools/version.sh check "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recorder image
        if: startsWith(github.ref_name, 'recorder-v')
        run: |
          (cd backend && ./gradlew :recorder:bootJar --no-daemon)
          docker buildx build --platform linux/arm64,linux/amd64 --push -t "$REGISTRY/transit-recorder:$VERSION" backend/recorder

      - uses: actions/setup-node@v4
        if: startsWith(github.ref_name, 'app-v')
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend and frontend images
        if: startsWith(github.ref_name, 'app-v')
        run: |
          (cd backend && ./gradlew :bootJar --no-daemon)
          (cd frontend && npm ci && npx ng build)
          docker buildx build --platform linux/arm64,linux/amd64 --push -t "$REGISTRY/transit-backend:$VERSION" backend
          docker buildx build --platform linux/arm64,linux/amd64 --push -t "$REGISTRY/transit-frontend:$VERSION" frontend
