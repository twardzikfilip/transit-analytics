# Who runs the BKM lines. BKM (Białostocka Komunikacja Miejska, run by the city's Zarząd BKM) organises public
# transport; three municipal companies operate the lines, each from its own depot (see map/depots.yml).
# Source: the BKM contact page, "Spółki przewozowe" (https://komunikacja.bialystok.pl/pl/informacje/kontakt/),
# read 18 Nov 2026. Each line's operator is stored on the route (route.operating_agency) when lines are classified.
#
# Each bus's operator is stored on the vehicle (vehicle.operating_agency), at startup and for newly registered buses:
#   1. a bus of an agency other than `shared-agency` (WSCHODEXPRESS, TUROSN, PKSNova) is run by that agency itself;
#   2. a bus of `shared-agency` is run by the company whose `vehicles` contain its number: single numbers or ranges
#      ("031-040"), of as many digits as the bus's number;
#   3. other buses have no operator.
# 007-030 and 041-050 were given by the lines they run (recorded positions up to 25 Nov 2026): each bus runs the lines
# of one company only. 010 was not seen in service; it is taken to belong with 007-012, the same model.
app:
  operators:
    shared-agency: BKM
    organiser: "BKM – Białostocka Komunikacja Miejska (Zarząd BKM, ul. Składowa 11)"
    companies:
      - code: KPKM
        name: "Komunalne Przedsiębiorstwo Komunikacji Miejskiej sp. z o.o."
        website: "https://www.kpkm.pl"
        depot: KPKM
        routes: ["2", "3", "5", "6", "8", "12", "17", "23", "24", "26", "27", "33", "102", "104", "105", "107", "122",
                "123", "132", "142", "N1", "N5", "N6", "J2", "J3", "J4"]
        vehicles: ["007-012", "041-050", "300-399", "800-999"]
      - code: KPK
        name: "Komunalne Przedsiębiorstwo Komunikacyjne sp. z o.o."
        website: "https://www.kpk.bialystok.pl"
        depot: KPK
        routes: ["4", "10", "11", "14", "16", "19", "20", "21", "22", "25", "28", "50", "100", "N2", "N3", "N4", "J1",
                "J5", "J6"]
        vehicles: ["013-030", "400-799"]
      - code: KZK
        name: "Komunalny Zakład Komunikacyjny sp. z o.o."
        website: "https://www.kzk.pl"
        depot: KZK
        routes: ["1", "7", "9", "13", "15", "18", "29", "30", "101", "103", "108", "109", "111", "112", "113", "126",
                "J"]
        vehicles: ["001-006", "031-040", "100-299"]
