server:
  # Gzip JSON responses (a day of position replay frames shrinks ~10x).
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

spring:
  application:
    name: transit-analytics
  config:
    # Vehicle and line classifications, in their own files. A copy in ./config/classification/ (next to the jar or
    # where the app is started) overrides the built-in one without rebuilding.
    import:
      - classpath:classification/vehicles.yml
      - classpath:classification/routes.yml
      - optional:file:./config/classification/vehicles.yml
      - optional:file:./config/classification/routes.yml
      - classpath:classification/operators.yml
      - optional:file:./config/classification/operators.yml
      - classpath:map/depots.yml
      - optional:file:./config/map/depots.yml
      - classpath:map/bus-lanes.yml
      - optional:file:./config/map/bus-lanes.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transit}
    username: ${DB_USER:transit}
    password: ${DB_PASSWORD:transit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      # Password of the read-only grafana_reader role (V8). Must match GRAFANA_DB_PASSWORD in docker-compose.yml.
      grafana_db_password: ${GRAFANA_DB_PASSWORD:grafana_reader}

app:
  jwt:
    # Dev default only — override with JWT_SECRET (min 32 bytes) in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  zbiorkom:
    base-url: ${ZBIORKOM_BASE_URL:https://api.zbiorkom.live/api6-open}
    connect-timeout: 3s
    read-timeout: 10s
    bialystok:
      bbox: ${ZBIORKOM_BIALYSTOK_BBOX:22.921150,53.016270,23.382496,53.243687}
  recording:
    # Poll the zbiorkom Białystok feed and store every vehicle position (position_sample) plus the raw response.
    enabled: ${RECORDING_ENABLED:true}
    cron: "*/20 * * * * *"         # every 20 seconds
    zone: Europe/Warsaw
    window-start: "03:30"
    window-end: "01:30"
    min-interval: 18s              # never poll more than once in 20 seconds
    archive-dir: ${RECORDING_ARCHIVE_DIR:data/raw}
    import-dir:                    # set to backfill saved snapshots, then the app exits
  gtfs:
    connect-timeout: 5s
    read-timeout: 60s
    max-download-size: 200MB
    bialystok:
      url: ${GTFS_BIALYSTOK_URL:https://komunikacja.bialystok.pl/cms/File/download/gtfs/google_transit.zip}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    # Keep the token entered via "Authorize" across page reloads.
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  # Only document our REST API, not actuator or error endpoints.
  paths-to-match: /api/**

# JDBC tracing (datasource-micrometer): spans for connections and queries. Result-set operations aren't observed:
# that wraps every ResultSet call in a proxy, which made reading a day of positions (340,000 rows) take 12 s, not 1.5.
jdbc:
  includes: CONNECTION, QUERY
  resultset-operations:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.name: transit-backend
      deployment.environment: ${ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
