# Bus depots (zajezdnie) of the BKM operators, drawn on the Routes map with the way buses probably drive between
# a depot and where they enter or leave service. Outlines: OpenStreetMap ways (© OpenStreetMap contributors, ODbL),
# fetched 18 Nov 2026; addresses from the companies' and Wikipedia's pages. Edit and restart; a copy in ./config/map/
# overrides this one.
app:
  map:
    # Driving routes between depots and stops: an OSRM server (the public demo by default; only coordinates are
    # sent). Off, or when it fails, the line is drawn straight.
    routing:
      enabled: true
      url: "https://router.project-osrm.org"
      timeout: 5s
    depots:
      - code: KPKM
        name: "Zajezdnia autobusowa KPKM"
        address: "ul. Składowa 11"
        source: "OpenStreetMap way 220402880"
