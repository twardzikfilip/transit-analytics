# transit-recorder: polls the zbiorkom.live Białystok feed and stores every position (see README, "Recorder").
spring:
  application:
    name: transit-recorder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transit}
    # Its own role (backend migration V16): adds vehicles and positions, nothing else.
    username: ${DB_USER:transit_recorder}
    password: ${DB_PASSWORD:transit_recorder}
    hikari:
      maximum-pool-size: 4
      # Start even when the database is down: polls are archived and spooled until it is back.
      initialization-fail-timeout: -1
  flyway:
    # The schema is the backend's; the recorder never migrates.
    enabled: false
  lifecycle:
    # A poll under way finishes before the app stops.
    timeout-per-shutdown-phase: 15s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

app:
  zbiorkom:
    base-url: ${ZBIORKOM_BASE_URL:https://api.zbiorkom.live/api6-open}
    connect-timeout: 3s
    read-timeout: 8s
    bialystok:
      # Every stop and route shape of the timetables (BKM, Wschód Express up to Trzcianne and Krypno, Turośń
      # Kościelna, PKS Nova) with 1.5–2 km to spare: buses outside the box aren't recorded.
      bbox: ${ZBIORKOM_BIALYSTOK_BBOX:22.45,52.88,23.48,53.44}
      # Lines left out everywhere (not stored, archived or shown): the cemetery lines C1, C2, … run around
      # All Saints' Day.
      excluded-lines: "^C[0-9]+$"
  recording:
    enabled: ${RECORDING_ENABLED:true}
    cron: "*/10 * * * * *"         # every 10 seconds
    zone: Europe/Warsaw
    window-start: "00:00"           # all day: night lines run 00:10–04:06 on weekend nights
    window-end: "23:59:59"
    min-interval: 8s               # never poll more than once in 10 seconds
    archive-dir: ${RECORDING_ARCHIVE_DIR:data/raw}
    spool-dir: ${RECORDING_SPOOL_DIR:data/spool}
    spool-every: 30s
    import-dir:                    # set to backfill saved snapshots, then the app exits

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  # Telemetry to the local OpenTelemetry collector (docker compose service otel-lgtm), like the backend's. The
  # metrics keep the backend's old names (transit.recording.*), so the Grafana panels carry on.
  opentelemetry:
    resource-attributes:
      service.name: transit-recorder
      deployment.environment: ${ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
