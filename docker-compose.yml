services:
  # PostgreSQL 17 with TimescaleDB (time-series tables, compression, continuous aggregates) and the
  # timescaledb_toolkit statistics functions. Data lives in the tsdata volume.
  postgres:
    image: timescale/timescaledb-ha:pg17.11-ts2.31.0
    container_name: transit-postgres
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 3s
      retries: 10

  # transit-recorder: polls the zbiorkom.live feed every 10 seconds and stores the positions, on its own so backend
  # restarts lose nothing. Restarts by itself (crash, reboot); upgrade it with backend/recorder/upgrade.sh. Runs as
  # your user so it can write the archive in backend/data (RECORDER_UID/GID if yours isn't 1000).
  recorder:
    build: ./backend/recorder
    image: transit-recorder
    container_name: transit-recorder
    restart: unless-stopped
    user: "${RECORDER_UID:-1000}:${RECORDER_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transit
      DB_USER: transit_recorder
      # Must match RECORDER_DB_PASSWORD given to the backend, which sets the role's password (migration V16).
      DB_PASSWORD: ${RECORDER_DB_PASSWORD:-transit_recorder}
      OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "127.0.0.1:8081:8081"   # the latest snapshot for the backend's Live map; health at /actuator/health
    volumes:
      - ./backend/data/raw:/data/raw
      - ./backend/data/spool:/data/spool
    stop_grace_period: 20s

  # Local observability: OpenTelemetry collector + Tempo (traces) + Prometheus (metrics) + Loki (logs)
  # + Grafana at http://localhost:3000. Development only; telemetry is kept in the lgtmdata volume.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.0
    container_name: transit-otel-lgtm
    environment:
      # Password of the read-only grafana_reader database user (must match the backend's GRAFANA_DB_PASSWORD).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader}
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      # Dashboards from grafana/dashboards/ appear in Grafana under "Transit Analytics".
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/transit.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/transit:ro
      # Read-only PostgreSQL datasource for the analytics dashboards (vehicle position history).
      - ./grafana/provisioning/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/transit-postgres.yaml:ro
      # Telemetry data (Prometheus, Tempo, Loki, Grafana state); survives container recreation.
      - lgtmdata:/data

volumes:
  tsdata:
  # Data of the old postgres:17 container, kept so you can switch back. Delete it with
  # `docker volume rm transit-analytics_pgdata` once you no longer need it.
  pgdata:
  lgtmdata:
