services:
  postgres:
    image: postgres:17
    container_name: transit-postgres
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
